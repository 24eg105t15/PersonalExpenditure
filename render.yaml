services:
  # ============================================================================
  # 1. Spring Boot Backend Web Service (Java 21)
  # ============================================================================
  - type: web
    name: spendwise-api-v2
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: JWT_SECRET
        value: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        value: "demo"

  # ============================================================================
  # 2. React Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: spendwise-web-v2
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
